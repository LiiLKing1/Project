<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Savdogar — Menu (Refined)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  :root{
    --bg:#ffffff;
    --panel-bg:#ffffff;
    --ink:#161a2b;
    --muted:#8890a6;
    --accent:#4f7dfb;
    --accent2:#9b6bff;
    --langbar-bg:#f3f4f9;
    --navshadow:rgba(22,26,43,0.06);
    --panelshadow:rgba(22,26,43,0.07);
  }
  body.dark{
    --bg:#050505;
    --panel-bg:#111319;
    --ink:#f5f6fa;
    --muted:#8b90a3;
    --accent:#7c9bff;
    --accent2:#b18cff;
    --langbar-bg:#1a1d27;
    --navshadow:rgba(0,0,0,0.4);
    --panelshadow:rgba(0,0,0,0.4);
  }

  *{ margin:0; padding:0; box-sizing:border-box; }
  html,body{ height:100%; }
  body{
    font-family:'Space Grotesk', system-ui, sans-serif;
    background:var(--bg);
    display:flex;
    flex-direction:column;
    align-items:center;
    padding-top:24px;
    transition: background-color .4s ease;
    overflow:hidden;
  }
  .wrap{ width:min(94vw,560px); height:calc(100% - 24px); display:flex; flex-direction:column; }

  .navbar{
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--panel-bg);
    border-radius:9999px;
    padding:14px 14px 14px 22px;
    box-shadow:0 1px 8px var(--navshadow);
    position:relative;
    z-index:2;
    flex-shrink:0;
    transition: background-color .4s ease;
  }
  .brand{ display:flex; align-items:center; gap:9px; cursor:pointer; }
  .brand svg{ width:20px; height:20px; display:block; }
  .brand span{ font-weight:700; font-size:17px; color:var(--ink); letter-spacing:-0.01em; }

  .nav-right{ display:flex; align-items:center; gap:6px; }

  .theme-toggle{
    width:34px; height:34px;
    border-radius:50%;
    border:none;
    background:var(--langbar-bg);
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
    position:relative;
  }
  .theme-toggle svg{ width:16px; height:16px; position:absolute; transition:opacity .3s, transform .3s; }
  .icon-sun{ stroke:var(--ink); opacity:1; transform:scale(1) rotate(0deg); }
  .icon-moon{ stroke:var(--ink); opacity:0; transform:scale(.5) rotate(-40deg); }
  body.dark .icon-sun{ opacity:0; transform:scale(.5) rotate(40deg); }
  body.dark .icon-moon{ opacity:1; transform:scale(1) rotate(0deg); }

  .toggle-label{
    font-weight:700; font-size:13px; letter-spacing:0.08em; color:var(--ink);
    padding:10px 8px; cursor:pointer;
  }

  .panel-outer{
    overflow:hidden;
    height:0;
    background:var(--panel-bg);
    border-radius:20px;
    margin-top:14px;
    box-shadow:0 8px 30px var(--panelshadow);
    position:relative;
    z-index:1;
    transition: background-color .4s ease;
  }
  .panel-inner{
    height:100%;
    display:flex;
    flex-direction:column;
    padding:20px 30px 24px;
  }

  .menu-center{
    flex:1;
    display:flex;
    flex-direction:column;
    justify-content:center;
  }
  .menu-list{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .menu-item{
    text-align:center;
    font-weight:800;
    font-size:clamp(1.4rem,5vw,1.9rem);
    color:var(--ink);
    letter-spacing:-0.01em;
    opacity:0;
    transform:translateY(16px);
    cursor:pointer;
    transition:color .2s;
  }
  .menu-item:hover{ color:var(--accent); }

  .lang-bar{
    flex-shrink:0;
    display:flex;
    align-items:center;
    justify-content:space-between;
    background:var(--langbar-bg);
    border-radius:9999px;
    padding:14px 26px;
    opacity:0;
    transform:translateY(16px);
    transition:background-color .4s ease;
  }
  .lang-bar button{
    border:none; background:transparent;
    font-family:inherit;
    font-weight:700;
    font-size:13px;
    letter-spacing:0.04em;
    color:var(--muted);
    cursor:pointer;
    transition:color .2s;
  }
  .lang-bar button.active{ color:var(--accent); }
</style>
</head>
<body>

<div class="wrap">
  <div class="navbar" id="navToggle">
    <div class="brand">
      <svg viewBox="0 0 100 100">
        <path d="M45.53,16.94 L14.47,79.06 Q10,88 20,88 L80,88 Q90,88 85.53,79.06 L54.47,16.94 Q50,8 45.53,16.94 Z"
              fill="none" stroke="var(--ink)" stroke-width="7" stroke-linejoin="round" stroke-linecap="round"/>
      </svg>
      <span>Savdogar</span>
    </div>
    <div class="nav-right">
      <button class="theme-toggle" id="themeToggle">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
      </button>
      <div class="toggle-label" id="toggleLabel">MENU</div>
    </div>
  </div>

  <div class="panel-outer" id="panelOuter">
    <div class="panel-inner" id="panelInner">
      <div class="menu-center">
        <div class="menu-list">
          <div class="menu-item">Xususiyatlar</div>
          <div class="menu-item">Biz haqimizda</div>
          <div class="menu-item">Narxlar</div>
          <div class="menu-item">Kirish</div>
        </div>
      </div>
      <div class="lang-bar">
        <button class="active">UZ</button>
        <button>EN</button>
        <button>RU</button>
      </div>
    </div>
  </div>
</div>

<script>
  const nav = document.getElementById('navToggle');
  const outer = document.getElementById('panelOuter');
  const inner = document.getElementById('panelInner');
  const label = document.getElementById('toggleLabel');
  const items = inner.querySelectorAll('.menu-item, .lang-bar');
  const themeBtn = document.getElementById('themeToggle');
  let isOpen = false;

  nav.addEventListener('click', () => {
    if (!isOpen) {
      isOpen = true;
      label.textContent = 'CLOSE';

      const navRect = nav.getBoundingClientRect();
      const targetHeight = window.innerHeight - navRect.bottom - 14 - 24;

      gsap.to(outer, { height: targetHeight, duration: 0.9, ease: 'back.out(1.4)' });
      gsap.to(items, { opacity: 1, y: 0, duration: 0.5, stagger: 0.06, delay: 0.25, ease: 'power2.out' });
    } else {
      isOpen = false;
      label.textContent = 'MENU';

      gsap.to(items, { opacity: 0, y: 10, duration: 0.2, stagger: 0.02, ease: 'power1.in' });
      gsap.to(outer, { height: 0, duration: 0.5, delay: 0.1, ease: 'power2.inOut' });
    }
  });

  document.querySelectorAll('.lang-bar button').forEach(btn => {
    btn.addEventListener('click', (e) => {
      e.stopPropagation();
      document.querySelectorAll('.lang-bar button').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
    });
  });

  themeBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    document.body.classList.toggle('dark');
  });
</script>

</body>
</html>
